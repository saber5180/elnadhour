# ============================================
# El Nadhour Cafe - Docker Compose
# ============================================
# To start:   docker compose up -d
# To stop:    docker compose down
# To rebuild: docker compose up -d --build
# To see logs: docker compose logs -f
# ============================================

services:

  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: elnadhour_db
      POSTGRES_USER: elnadhour
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elnadhour -d elnadhour_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Node.js Backend API ---
  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      UPLOAD_DIR: uploads
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: elnadhour_db
      DB_USER: elnadhour
      DB_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_random_string}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://elnadhoure-cafe.tn,https://www.elnadhoure-cafe.tn}
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  # --- React Frontend (served by Nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ""
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates (created by setup-ssl.sh into ./ssl/)
      - ./ssl:/etc/nginx/ssl:ro

# Persistent storage
volumes:
  pgdata:
  uploads:
